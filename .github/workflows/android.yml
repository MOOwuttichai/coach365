name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web dir (bundled offline page; the app loads GitHub Pages)
        run: |
          mkdir -p www
          cp -r index.html style.css *.js manifest.webmanifest offline.html icons img www/

      - name: Add Android project
        run: npx cap add android

      - name: App icons
        run: |
          mkdir -p assets
          cp android-res/icon-1024.png assets/icon-only.png
          cp android-res/icon-1024.png assets/icon-foreground.png
          cp android-res/icon-bg-1024.png assets/icon-background.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#2B55D9' --iconBackgroundColorDark '#2B55D9' --splashBackgroundColor '#2B55D9' --splashBackgroundColorDark '#2B55D9' || echo "asset generation skipped"
          mkdir -p android/app/src/main/res/drawable
          cp android-res/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

      - name: Permissions (camera for pose check, exact alarms for reminders)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' $M
          grep -c "uses-permission" $M

      - name: Home-screen widget
        run: |
          P=android/app/src/main/java/com/oofsss/coach365
          cp android-src/java/*.java $P/
          cp -rT android-src/res android/app/src/main/res
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          r = ('        <receiver android:name="com.oofsss.coach365.CoachWidget" android:exported="false">\n'
               '            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n'
               '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/coach_widget_info" />\n'
               '        </receiver>\n    </application>')
          assert "</application>" in s
          open(p, "w", encoding="utf-8").write(s.replace("</application>", r, 1))
          EOF
          grep -n "CoachWidget" android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Coach365.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Coach365-apk
          path: Coach365.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Coach 365 Android (ล่าสุด)
          body: |
            ดาวน์โหลด **Coach365.apk** ด้านล่างแล้วเปิดไฟล์บนมือถือ Android เพื่อติดตั้ง
            (ครั้งแรกต้องอนุญาต "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก")
            แอปโหลดหน้าจากเว็บ จึงอัปเดตเองทุกครั้งที่มีเวอร์ชันใหม่ ไม่ต้องลง APK ซ้ำ
            มีวิดเจ็ตหน้าจอโฮม: กดค้างที่หน้าโฮม → วิดเจ็ต → Coach 365
          files: Coach365.apk
          prerelease: false
